[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optcon"
version = "0.1.1"
description = "Dimensional, contract-checked physical computation for optics and machine learning"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Zhe Su" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "optics",
    "photonics",
    "units",
    "dimensional-analysis",
    "differentiable-simulation",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "setuptools>=68",
  "wheel>=0.42",
  "pytest>=7",
  "pytest-cov>=4.0",
  "ruff>=0.5",
  "mypy>=1.8",
  "matplotlib>=3.7",
]
engines = [
  "miepython>=2.5",
  "PyMieScatt>=1.7",
  "shapely>=2.0",
  "LightPipes>=2.1",
  "tmm>=0.1.8",
]
all = [
  "build>=1.2",
  "setuptools>=68",
  "wheel>=0.42",
  "pytest>=7",
  "pytest-cov>=4.0",
  "ruff>=0.5",
  "mypy>=1.8",
  "matplotlib>=3.7",
  "miepython>=2.5",
  "PyMieScatt>=1.7",
  "shapely>=2.0",
  "LightPipes>=2.1",
  "tmm>=0.1.8",
]

[project.urls]
Homepage = "https://github.com/WhitePepperLambSoup/optcon"
Repository = "https://github.com/WhitePepperLambSoup/optcon"
Issues = "https://github.com/WhitePepperLambSoup/optcon/issues"

[tool.setuptools]
# This repository keeps the package at the top level of its own directory, so
# the package root maps onto "." rather than the usual "src/" layout.
packages = ["optcon", "optcon.engines", "optcon.examples", "optcon.benchmarks"]
package-dir = { optcon = ".", "optcon.engines" = "engines", "optcon.examples" = "examples", "optcon.benchmarks" = "benchmarks" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-q"

[tool.coverage.run]
source = ["optcon"]
omit = ["*/examples/*", "*/benchmarks/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tmp", "tmp_pytest"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# examples print wide tables and tests carry long explanatory names
"tests/*" = ["E501"]
"examples/*" = ["E501"]
"docs/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["optcon"]

[tool.mypy]
# numpy's bundled stubs use the PEP 695 ``type`` statement, which mypy can
# only parse when told the target is 3.12 or newer.  The runtime floor stays
# at 3.11 (see requires-python); this affects type checking only.
python_version = "3.12"
exclude = ["^tmp/", "^tmp_pytest/"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
