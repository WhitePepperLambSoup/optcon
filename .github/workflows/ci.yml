name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: python -m pytest tests --cov=optcon --cov-report=term-missing:skip-covered -q
      - name: Run end-to-end benchmark reproducibility suite
        run: python -m optcon.benchmarks.run_all
      - name: Lint with ruff
        run: python -m ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Type check with mypy
        run: python -m mypy .

  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optcon with differential engines
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"
      - name: Run differential verification tests with external engines
        run: python -m pytest tests/test_engines_extended.py -q
      - name: Run cross-engine adjudications
        run: |
          python -m optcon.examples.experiment_02_cross_engine
          python -m optcon.examples.experiment_03_mie_adjudication
          python -m optcon.examples.experiment_04_beam_adjudication

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel and sdist
        run: python -m build
      - name: Install from wheel into clean environment
        run: |
          python -m pip install dist/*.whl
      - name: Verify installed package imports and semantics
        run: |
          python -c "import optcon; print('Version:', optcon.__version__)"
          python -c "from optcon import Quantity, assert_unitary; from optcon.units import meter; print('Core import OK: 1 meter =', Quantity(1.0, meter))"


