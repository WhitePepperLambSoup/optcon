name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: python -m pytest tests --cov=optcon --cov-report=term-missing:skip-covered -q
      - name: Run end-to-end benchmark reproducibility suite
        run: python -m optcon.benchmarks.run_all --skip-unavailable
      - name: Lint with ruff
        run: python -m ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Type check with mypy
        run: python -m mypy .

  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optcon with differential engines
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,engines]"
      - name: Report optional engine availability
        run: python -m optcon.benchmarks.engine_status --strict
      - name: Run differential verification tests with external engines
        run: python -m pytest tests/test_engines_extended.py -q
      - name: Run cross-engine adjudications
        run: |
          python -m optcon.examples.experiment_02_cross_engine
          python -m optcon.examples.experiment_03_mie_adjudication
          python -m optcon.examples.experiment_04_beam_adjudication

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel and sdist
        run: python -m build
      - name: Install wheel into isolated virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/optcon-wheel-check"
          "$RUNNER_TEMP/optcon-wheel-check/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/optcon-wheel-check/bin/python" -m pip install dist/*.whl matplotlib
      - name: Verify installed package and reproducibility entry points
        run: |
          "$RUNNER_TEMP/optcon-wheel-check/bin/python" -c "import optcon; print(\"Version:\", optcon.__version__)"
          "$RUNNER_TEMP/optcon-wheel-check/bin/python" -c "from optcon import Quantity, unit, assert_unitary; print(\"Core import OK: 1 meter =\", Quantity(1.0, unit(\"m\")))"
          "$RUNNER_TEMP/optcon-wheel-check/bin/python" -c "import optcon.examples.experiment_05_cavity_thermal_tolerance; import optcon.benchmarks.run_all; print(\"Reproducibility modules import OK\")"
          "$RUNNER_TEMP/optcon-wheel-check/bin/python" -m optcon.benchmarks.run_all --skip-unavailable
